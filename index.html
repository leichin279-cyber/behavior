<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#132A33">
<title>행동기록 · 탭 두 번</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app">
  <nav id="rail" aria-label="주 메뉴">
    <div class="rail-mark" aria-hidden="true"><span></span><span></span><span></span></div>
    <button class="rail-btn" data-nav="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><span>홈</span></button>
    <button class="rail-btn" data-nav="report"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M7 20v-7M12 20V7M17 20v-4"/></svg><span>리포트</span></button>
    <button class="rail-btn" data-nav="setup"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10 1.4 1.4m0-12.8-1.4 1.4m-10 10-1.4 1.4"/></svg><span>설정</span></button>
  </nav>

  <main id="main" tabindex="-1"></main>

  <aside id="side" hidden>
    <div class="side-head">이번 세션 기록</div>
    <div id="side-log" class="side-log"></div>
  </aside>
</div>

<div id="snackbar" class="snackbar" hidden aria-live="polite"></div>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" hidden aria-live="polite"></div>

<script src="js/store.js"></script>
<script src="js/charts.js"></script>
<script src="js/reports.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
