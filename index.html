<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#132A33">
<title>행동기록 · 탭 두 번</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --ink:#132A33; --ink-2:#3E5560; --ink-3:#71868F;
  --paper:#EDF1F0; --surface:#FFFFFF; --surface-2:#F6F9F8;
  --line:#D5DCDA; --line-2:#BAC6C3;
  --accent:#0E6E5C; --accent-soft:#E0EFEB;
  --live:#BE4227; --live-soft:#FBE9E4;
  --warn:#8A5B00;
  --radius:14px; --radius-sm:9px;
  --tap:64px;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"D2Coding",monospace;
  --shadow:0 1px 2px rgba(19,42,51,.06),0 8px 24px rgba(19,42,51,.07);
}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#E4EAE8; --ink-2:#AFBEBB; --ink-3:#8496A0;
    --paper:#101A1E; --surface:#182529; --surface-2:#1E2D32;
    --line:#2C3D43; --line-2:#3C5158;
    --accent:#4FBFA3; --accent-soft:#12332D;
    --live:#F08163; --live-soft:#3A1D14;
    --warn:#D7A54A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* hidden 속성은 어떤 display 선언보다 우선한다 — 오버레이가 화면을 막는 것을 방지 */
[hidden]{display:none !important}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:1.35rem}
h2{font-size:1.05rem}
h3{font-size:.95rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---------- shell ---------- */
#app{
  min-height:100dvh;display:grid;
  grid-template-columns:1fr;
  grid-template-rows:1fr auto;
  grid-template-areas:"main" "rail";
}
#main{
  grid-area:main;min-width:0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));
  max-width:100%;
}
#side{display:none}

#rail{
  grid-area:rail;display:flex;
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
  position:sticky;bottom:0;z-index:20;
}
.rail-mark{display:none}
.rail-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 4px;color:var(--ink-3);font-size:.7rem;font-weight:500;
}
.rail-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rail-btn[aria-current="page"]{color:var(--accent)}

@media (min-width:900px){
  #app{
    grid-template-columns:96px minmax(0,1fr);
    grid-template-rows:1fr;
    grid-template-areas:"rail main";
  }
  #main{padding:28px 32px;max-width:1100px}
  #rail{
    flex-direction:column;gap:4px;border-top:0;border-right:1px solid var(--line);
    padding:20px 8px;position:sticky;top:0;height:100dvh;
  }
  .rail-mark{display:flex;gap:3px;justify-content:center;margin-bottom:22px}
  .rail-mark span{width:4px;height:18px;border-radius:2px;background:var(--accent);opacity:.85}
  .rail-mark span:nth-child(2){height:26px;opacity:.55}
  .rail-mark span:nth-child(3){height:12px;opacity:.35}
  .rail-btn{flex:0 0 auto;border-radius:var(--radius-sm);padding:12px 4px;font-size:.72rem}
  .rail-btn[aria-current="page"]{background:var(--accent-soft)}
}
@media (min-width:1280px){
  #app{grid-template-columns:96px minmax(0,1fr) 320px;grid-template-areas:"rail main side"}
  #side{
    grid-area:side;display:block;border-left:1px solid var(--line);
    background:var(--surface);height:100dvh;position:sticky;top:0;overflow:auto;
  }
  #side[hidden]{display:none}
  .side-head{
    padding:18px 18px 10px;font-size:.75rem;font-weight:600;
    letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase;
  }
  .side-log{padding:0 12px 24px}
}

/* ---------- generic bits ---------- */
.page-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-head .grow{flex:1;min-width:0}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase;margin-bottom:2px}
.muted{color:var(--ink-3)}
.small{font-size:.82rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card + .card{margin-top:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.divider{height:1px;background:var(--line);margin:14px 0}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:44px;padding:0 16px;border-radius:var(--radius-sm);
  background:var(--surface);border:1px solid var(--line-2);
  font-size:.92rem;font-weight:500;transition:background .12s,border-color .12s;
}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--live);border-color:var(--live)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.block{width:100%}
.btn.lg{min-height:56px;font-size:1rem}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-back{display:inline-flex;align-items:center;gap:6px;min-height:40px;color:var(--ink-2);font-weight:500;font-size:.9rem}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:.8rem;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{
  min-height:44px;padding:10px 12px;border:1px solid var(--line-2);
  border-radius:var(--radius-sm);background:var(--surface-2);width:100%;
}
.field textarea{min-height:84px;resize:vertical;line-height:1.5}
.field .hint{font-size:.76rem;color:var(--ink-3)}
.grid-2{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:640px){.grid-2{grid-template-columns:1fr 1fr}}

.pill{
  display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--line);font-size:.76rem;font-weight:500;color:var(--ink-2);
}
.pill.solid{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.badge-measure{font-size:.68rem;padding:2px 7px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-3);font-weight:600}

.empty{
  text-align:center;padding:38px 20px;border:1px dashed var(--line-2);
  border-radius:var(--radius);color:var(--ink-3);background:var(--surface-2);
}
.empty strong{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}

/* ---------- student list ---------- */
.student-row{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:14px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--surface);margin-bottom:8px;
}
.student-row:hover{border-color:var(--accent)}

/* ---------- tiles ---------- */
.tile-grid{
  display:grid;gap:10px;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
}
@media (max-width:420px){.tile-grid{grid-template-columns:repeat(2,1fr);gap:8px}}
@media (min-width:900px){.tile-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}}

.tile{
  --cat:var(--accent);
  position:relative;display:flex;flex-direction:column;justify-content:space-between;
  min-height:var(--tap);padding:14px;border-radius:var(--radius);text-align:left;
  background:color-mix(in srgb,var(--cat) 9%,var(--surface));
  border:1px solid color-mix(in srgb,var(--cat) 26%,var(--line));
  color:color-mix(in srgb,var(--cat) 82%,var(--ink));
  transition:transform .09s ease,box-shadow .12s;
}
@media (prefers-color-scheme:dark){
  .tile{
    background:color-mix(in srgb,var(--cat) 16%,var(--surface));
    color:color-mix(in srgb,var(--cat) 55%,#FFFFFF);
    border-color:color-mix(in srgb,var(--cat) 38%,var(--line));
  }
}
.tile:active{transform:scale(.97)}
.tile.big{min-height:96px}
@media (min-width:900px){.tile.big{min-height:112px}}
.tile-label{font-weight:600;font-size:1rem;line-height:1.3;word-break:keep-all}
.tile-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:8px}
.tile-count{font-family:var(--mono);font-size:1.5rem;font-weight:600;line-height:1;opacity:.9}
.tile-count.zero{opacity:.28}
.tile-sub{font-size:.7rem;font-weight:600;opacity:.7;letter-spacing:.02em}
.tile.running{
  background:var(--live-soft);border-color:var(--live);color:var(--live);
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(190,66,39,.28)}50%{box-shadow:0 0 0 6px rgba(190,66,39,0)}}
@media (prefers-reduced-motion:reduce){.tile.running{animation:none}}

/* ---------- session ---------- */
.session-bar{
  position:sticky;top:0;z-index:15;margin:-16px -16px 14px;padding:12px 16px;
  background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
@media (min-width:900px){.session-bar{margin:-28px -32px 18px;padding:14px 32px;border-radius:0}}
.session-bar .who{font-weight:600}
.session-bar .ctx{font-size:.76rem;color:var(--ink-3)}
.clock{font-family:var(--mono);font-size:.9rem;color:var(--ink-2);font-variant-numeric:tabular-nums}

.live-strip{
  display:flex;align-items:center;gap:10px;padding:11px 14px;margin-bottom:12px;
  border-radius:var(--radius);background:var(--live-soft);
  border:1px solid color-mix(in srgb,var(--live) 40%,transparent);color:var(--live);
}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--live);animation:blink 1.1s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live-dot{animation:none}}
.live-strip .name{font-weight:600;font-size:.92rem}
.live-strip .t{font-family:var(--mono);font-size:1.15rem;font-weight:600;margin-left:auto}

.cue-strip{
  display:flex;align-items:center;gap:10px;padding:11px 14px;margin-bottom:12px;
  border-radius:var(--radius);background:var(--surface);border:1px dashed var(--line-2);
}
.cue-strip.active{border-style:solid;border-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--surface))}

.log-item{display:flex;gap:10px;align-items:baseline;padding:9px 6px;border-bottom:1px solid var(--line)}
.log-item .ts{font-family:var(--mono);font-size:.75rem;color:var(--ink-3);flex:0 0 auto}
.log-item .nm{font-size:.86rem;flex:1;min-width:0}
.log-item .vl{font-family:var(--mono);font-size:.78rem;color:var(--ink-2)}
.log-item.rep .nm{color:var(--accent)}

/* ---------- snackbar / sheet / toast ---------- */
.snackbar{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(74px + env(safe-area-inset-bottom));width:min(560px,calc(100% - 20px));
  background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:12px 14px 10px;z-index:40;
}
@media (min-width:900px){.snackbar{bottom:22px}}
.snackbar .sb-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.snackbar .sb-name{font-weight:600;font-size:.92rem;flex:1;min-width:0}
.snackbar .sb-undo{color:var(--live);font-weight:600;font-size:.86rem;padding:6px 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  padding:7px 11px;border-radius:999px;border:1px solid var(--line-2);
  background:var(--surface-2);font-size:.78rem;font-weight:500;color:var(--ink-2);
}
.chip:hover{border-color:var(--ink-3)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip-label{font-size:.7rem;font-weight:600;color:var(--ink-3);letter-spacing:.05em;margin:8px 0 5px}
.sb-progress{height:2px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden}
.sb-progress i{display:block;height:100%;background:var(--accent);transform-origin:left}

.sheet{
  position:fixed;inset:0;z-index:60;display:grid;align-items:end;
  background:rgba(10,20,24,.42);
}
@media (min-width:640px){.sheet{align-items:center;justify-items:center}}
.sheet-panel{
  background:var(--surface);width:100%;max-height:88dvh;overflow:auto;
  border-radius:var(--radius) var(--radius) 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
}
@media (min-width:640px){.sheet-panel{width:min(560px,92vw);border-radius:var(--radius)}}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet-head h2{flex:1}
.sheet-close{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:1.1rem;color:var(--ink-2)}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;
  font-size:.85rem;z-index:70;box-shadow:var(--shadow);
}
@media (min-width:900px){.toast{bottom:24px}}

/* ---------- interval mode ---------- */
.iv-clock{text-align:center;padding:22px 0 10px}
.iv-count{font-family:var(--mono);font-size:clamp(3rem,16vw,5rem);font-weight:600;line-height:1}
.iv-meta{color:var(--ink-3);font-size:.85rem;margin-top:6px}
.iv-bar{height:10px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin:14px 0}
.iv-bar i{display:block;height:100%;background:var(--accent);width:0}
.iv-cells{display:flex;gap:3px;flex-wrap:wrap;margin-top:12px}
.iv-cell{width:16px;height:22px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line)}
.iv-cell.hit{background:var(--accent);border-color:var(--accent)}
.iv-cell.now{outline:2px solid var(--warn);outline-offset:1px}
.iv-toggle{
  display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  min-height:72px;padding:14px 16px;border-radius:var(--radius);
  border:1px solid var(--line-2);background:var(--surface);font-weight:600;margin-bottom:10px;
}
.iv-toggle .state{font-size:.8rem;font-weight:600;color:var(--ink-3)}
.iv-toggle.on{background:var(--live-soft);border-color:var(--live);color:var(--live)}
.iv-toggle.on .state{color:var(--live)}

/* ---------- reports ---------- */
.rep-grid{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:1000px){.rep-grid{grid-template-columns:1fr 1fr}}
.rep-grid .wide{grid-column:1/-1}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 12px}
.stat .k{font-size:.72rem;color:var(--ink-3);font-weight:600}
.stat .v{font-family:var(--mono);font-size:1.25rem;font-weight:600;margin-top:2px}
.stat .d{font-size:.72rem;color:var(--ink-3)}
.chart-wrap{width:100%;overflow:hidden}
.chart-wrap svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.76rem;color:var(--ink-3);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.note{font-size:.78rem;color:var(--ink-3);margin-top:8px;line-height:1.5}
.table{width:100%;border-collapse:collapse;font-size:.85rem}
.table th{text-align:left;font-size:.72rem;color:var(--ink-3);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.table td{padding:8px;border-bottom:1px solid var(--line)}
.table td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}

/* ---------- setup ---------- */
.def-row{
  display:flex;align-items:center;gap:10px;padding:11px 12px;
  border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);margin-bottom:6px;
}
.def-row .nm{flex:1;min-width:0;font-weight:500}
.def-row.archived{opacity:.5}
.swatch{width:14px;height:14px;border-radius:4px;flex:0 0 14px}
.icon-btn{width:36px;height:36px;border-radius:var(--radius-sm);display:grid;place-items:center;color:var(--ink-3);background:var(--surface-2)}
.icon-btn:hover{color:var(--ink)}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.section-title{display:flex;align-items:center;gap:8px;margin:20px 0 10px}
.section-title h2{flex:1}

/* ---------- 추가: 편집 진입점 ---------- */
.student-main{
  display:flex;align-items:center;gap:12px;flex:1;min-width:0;
  text-align:left;background:none;padding:0;
}
button.log-item{
  width:100%;text-align:left;background:none;border-radius:var(--radius-sm);
  transition:background .12s;
}
button.log-item:hover{background:var(--surface-2)}
.iv-group{margin-bottom:14px}
.iv-group-head{
  display:flex;align-items:center;gap:7px;font-size:.76rem;font-weight:600;
  color:var(--ink-3);margin-bottom:7px;
}
.btn.small{min-height:32px;padding:0 10px;font-size:.78rem}

</style>
</head>
<body>

<div id="app">
  <nav id="rail" aria-label="주 메뉴">
    <div class="rail-mark" aria-hidden="true"><span></span><span></span><span></span></div>
    <button class="rail-btn" data-nav="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><span>홈</span></button>
    <button class="rail-btn" data-nav="report"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M7 20v-7M12 20V7M17 20v-4"/></svg><span>리포트</span></button>
    <button class="rail-btn" data-nav="setup"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10 1.4 1.4m0-12.8-1.4 1.4m-10 10-1.4 1.4"/></svg><span>설정</span></button>
  </nav>

  <main id="main" tabindex="-1"></main>

  <aside id="side" hidden>
    <div class="side-head">이번 세션 기록</div>
    <div id="side-log" class="side-log"></div>
  </aside>
</div>

<div id="snackbar" class="snackbar" hidden aria-live="polite"></div>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" hidden aria-live="polite"></div>

<script>
/* store.js — 저장소 어댑터와 데이터 모델
   Claude 아티팩트에서는 window.storage, 그 외(GitHub Pages·로컬)에서는 localStorage를 사용합니다. */

var Store = (function () {
  var useArtifact = (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function');

  async function readRaw(key) {
    if (useArtifact) {
      try { var r = await window.storage.get(key, false); return r ? r.value : null; }
      catch (e) { return null; }
    }
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  async function writeRaw(key, val) {
    if (useArtifact) {
      try { await window.storage.set(key, val, false); return true; } catch (e) { return false; }
    }
    try { localStorage.setItem(key, val); return true; } catch (e) { return false; }
  }
  return {
    backend: useArtifact ? 'artifact' : 'local',
    async get(key) { var s = await readRaw(key); if (!s) return null; try { return JSON.parse(s); } catch (e) { return null; } },
    async set(key, obj) { return writeRaw(key, JSON.stringify(obj)); }
  };
})();

var DB = (function () {
  var KEY_CONFIG = 'bt.config.v1';
  var KEY_DATA = 'bt.data.v1';
  var db = null;

  function uid(p) { return (p || 'x') + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 6); }

/* charts.js — 외부 라이브러리 없이 SVG로 그리는 차트 */
var Charts = (function () {
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
  function nice(max) {
    if (max <= 5) return 5;
    var p = Math.pow(10, Math.floor(Math.log10(max)));
    return Math.ceil(max / p) * p;
  }
  function wrap(w, h, inner) {
    return '<div class="chart-wrap"><svg viewBox="0 0 ' + w + ' ' + h + '" role="img" preserveAspectRatio="xMidYMid meet">' + inner + '</svg></div>';
  }

  /* 다중 시계열 선그래프 */
  function line(opt) {
    var labels = opt.labels || [], series = opt.series || [];
    var W = 640, H = opt.height || 230, L = 42, R = 14, T = 16, B = 34;
    if (!labels.length) return emptyBox('표시할 데이터가 없습니다');
    var max = 0;
    series.forEach(function (s) { s.values.forEach(function (v) { if (v > max) max = v; }); });
    max = nice(max || 1);
    var iw = W - L - R, ih = H - T - B;
    var stepX = labels.length > 1 ? iw / (labels.length - 1) : 0;
    var x = function (i) { return L + i * stepX; };
    var y = function (v) { return T + ih - (v / max) * ih; };
    var out = '';
    for (var g = 0; g <= 4; g++) {
      var gv = max * g / 4, gy = y(gv);
      out += '<line x1="' + L + '" y1="' + gy + '" x2="' + (W - R) + '" y2="' + gy + '" stroke="var(--line)" stroke-width="1"/>';
      out += '<text x="' + (L - 7) + '" y="' + (gy + 4) + '" text-anchor="end" font-size="10" fill="var(--ink-3)" font-family="var(--mono)">' + (Math.round(gv * 10) / 10) + '</text>';
    }
    var every = Math.ceil(labels.length / 7);
    labels.forEach(function (lb, i) {
      if (i % every !== 0 && i !== labels.length - 1) return;
      out += '<text x="' + x(i) + '" y="' + (H - 12) + '" text-anchor="middle" font-size="10" fill="var(--ink-3)">' + esc(lb) + '</text>';
    });
    if (opt.markerIndex != null && opt.markerIndex >= 0) {
      var mx = x(opt.markerIndex);
      out += '<line x1="' + mx + '" y1="' + T + '" x2="' + mx + '" y2="' + (T + ih) + '" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="4 3"/>';
      out += '<text x="' + (mx + 4) + '" y="' + (T + 10) + '" font-size="10" fill="var(--warn)">' + esc(opt.markerLabel || '중재 시작') + '</text>';
    }
    series.forEach(function (s) {
      var d = '', pts = '';
      s.values.forEach(function (v, i) {
        d += (i ? ' L' : 'M') + x(i) + ' ' + y(v);
        pts += '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="2.6" fill="' + s.color + '"/>';
      });
      out += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' + pts;
    });
    return wrap(W, H, out);
  }

  /* 가로 막대 */
  function bars(opt) {
    var items = opt.items || [];
    if (!items.length) return emptyBox('표시할 데이터가 없습니다');
    var W = 640, rowH = 30, L = 132, R = 46, T = 8;
    var H = T * 2 + items.length * rowH;
    var max = 0; items.forEach(function (it) { if (it.value > max) max = it.value; });
    max = max || 1;
    var iw = W - L - R, out = '';
    items.forEach(function (it, i) {
      var yy = T + i * rowH, bw = Math.max(2, (it.value / max) * iw);
      out += '<text x="' + (L - 10) + '" y="' + (yy + 18) + '" text-anchor="end" font-size="12" fill="var(--ink-2)">' + esc(it.label) + '</text>';
      out += '<rect x="' + L + '" y="' + (yy + 6) + '" width="' + bw + '" height="17" rx="4" fill="' + (it.color || 'var(--accent)') + '"/>';
      out += '<text x="' + (L + bw + 7) + '" y="' + (yy + 19) + '" font-size="11" fill="var(--ink-3)" font-family="var(--mono)">' + esc(it.display != null ? it.display : it.value) + '</text>';
    });
    return wrap(W, H, out);
  }

  /* 히트맵 (행 = 교시, 열 = 요일) */
  function heatmap(opt) {
    var rows = opt.rows || [], cols = opt.cols || [], grid = opt.grid || [];
    var cw = 74, ch = 34, L = 54, T = 26;
    var W = L + cols.length * cw + 10, H = T + rows.length * ch + 12;
    var max = 0;
    grid.forEach(function (r) { r.forEach(function (v) { if (v > max) max = v; }); });
    var out = '';
    cols.forEach(function (c, j) {
      out += '<text x="' + (L + j * cw + cw / 2) + '" y="' + (T - 9) + '" text-anchor="middle" font-size="11" fill="var(--ink-3)">' + esc(c) + '</text>';
    });
    rows.forEach(function (r, i) {
      out += '<text x="' + (L - 9) + '" y="' + (T + i * ch + ch / 2 + 4) + '" text-anchor="end" font-size="11" fill="var(--ink-3)">' + esc(r) + '</text>';
      cols.forEach(function (c, j) {
        var v = (grid[i] && grid[i][j]) || 0;
        var a = max ? 0.08 + 0.82 * (v / max) : 0.06;
        out += '<rect x="' + (L + j * cw + 2) + '" y="' + (T + i * ch + 2) + '" width="' + (cw - 4) + '" height="' + (ch - 4) + '" rx="5" fill="var(--accent)" opacity="' + (v ? a.toFixed(2) : 0.05) + '"/>';
        if (v) out += '<text x="' + (L + j * cw + cw / 2) + '" y="' + (T + i * ch + ch / 2 + 4) + '" text-anchor="middle" font-size="11" font-family="var(--mono)" fill="' + (a > 0.55 ? '#fff' : 'var(--ink-2)') + '">' + v + '</text>';
      });
    });
    return wrap(W, H, out);
  }

  function emptyBox(msg) {
    return '<div class="empty small" style="padding:24px">' + esc(msg) + '</div>';
  }

  return { line: line, bars: bars, heatmap: heatmap, empty: emptyBox, esc: esc };
})();

    var evs = DB.eventsFor(studentId, from, to);
    var sessions = DB.dat().sessions.filter(function (s) { return s.studentId === studentId && s.startedAt >= from && s.startedAt <= to; });
    var cues = DB.dat().cues.filter(function (c) { return c.studentId === studentId && c.ts >= from && c.ts <= to; });
    var runs = DB.dat().intervalRuns.filter(function (r) { return r.studentId === studentId && r.ts >= from && r.ts <= to; });
    return { events: evs, sessions: sessions, cues: cues, runs: runs };
  }

  /* 하루별 관찰 시간(분). 실시간 기록 세션만 센다. */
  function dailyMinutes(sessions, days) {
    var mins = {};
    days.forEach(function (d) { mins[d] = 0; });
    sessions.forEach(function (s) {
      if (s.mode === 'interval') return;
      var k = dayKey(s.startedAt); if (!(k in mins)) return;
      var end = s.endedAt || s.startedAt;
      mins[k] += Math.max(0, (end - s.startedAt) / 60000);
    });
    return mins;
  }

  function dailySeries(evs, days, sessions, asRate) {
    var prob = {}, rep = {};
    days.forEach(function (d) { prob[d] = 0; rep[d] = 0; });
    evs.forEach(function (e) {
      var b = DB.behavior(e.behaviorId); if (!b) return;
      var k = dayKey(e.ts); if (!(k in prob)) return;
      if (b.isReplacement) rep[k]++; else prob[k]++;
    });
    if (!asRate) {
      return {
        problem: days.map(function (d) { return prob[d]; }),
        replacement: days.map(function (d) { return rep[d]; })
      };
    }
    var mins = dailyMinutes(sessions, days);
    var conv = function (map) {
      return days.map(function (d) {
        var m = mins[d];
        if (!m || m < 0.5) return 0;
        return Math.round((map[d] / m) * 100) / 100;
      });
    };
    return { problem: conv(prob), replacement: conv(rep), minutes: mins };
  }

  function totalMinutes(sessions) {
    return sessions.reduce(function (a, s) {
      if (s.mode === 'interval') return a;
      return a + Math.max(0, ((s.endedAt || s.startedAt) - s.startedAt) / 60000);
    }, 0);
  }

  function heatGrid(sessions, evs) {
    var periods = [];
    sessions.forEach(function (s) { if (s.period && periods.indexOf(s.period) < 0) periods.push(s.period); });
    periods.sort(function (a, b) { return String(a).localeCompare(String(b), 'ko', { numeric: true }); });
    if (!periods.length) return null;
    var cols = ['월', '화', '수', '목', '금'];
    var grid = periods.map(function () { return cols.map(function () { return 0; }); });
    var smap = {}; sessions.forEach(function (s) { smap[s.id] = s; });
    evs.forEach(function (e) {
      var b = DB.behavior(e.behaviorId); if (!b || b.isReplacement) return;
      var s = smap[e.sessionId]; if (!s || !s.period) return;
      var wd = WD[new Date(e.ts).getDay()], ci = cols.indexOf(wd), ri = periods.indexOf(s.period);
      if (ci < 0 || ri < 0) return;
      grid[ri][ci]++;
    });
    return { rows: periods, cols: cols, grid: grid };
  }

  function antecedentBars(evs) {
    var counts = {};
    evs.forEach(function (e) { if (e.antecedentId) counts[e.antecedentId] = (counts[e.antecedentId] || 0) + 1; });
    return DB.antecedents(true).map(function (a) { return { label: a.label, value: counts[a.id] || 0 }; })
      .filter(function (i) { return i.value > 0; })
      .sort(function (a, b) { return b.value - a.value; });
  }
  function consequenceBars(evs) {
    var counts = {};
    evs.forEach(function (e) { if (e.consequenceId) counts[e.consequenceId] = (counts[e.consequenceId] || 0) + 1; });
    return DB.consequences(true).map(function (c) { return { label: c.label, value: counts[c.id] || 0, color: 'var(--ink-3)' }; })
      .filter(function (i) { return i.value > 0; })
      .sort(function (a, b) { return b.value - a.value; });
  }

  function byBehavior(evs) {
    var map = {};
    evs.forEach(function (e) { (map[e.behaviorId] = map[e.behaviorId] || []).push(e); });
    return map;
  }

  /* 반응간시간: 직전 동일행동 종료 → 이번 시작 */
  function irtTable(evs) {
    var map = byBehavior(evs), out = [];
    Object.keys(map).forEach(function (bid) {
      var b = DB.behavior(bid); if (!b || b.isReplacement) return;
      var list = map[bid].slice().sort(function (a, b2) { return a.ts - b2.ts; });
      if (list.length < 2) return;
      var gaps = [];
      for (var i = 1; i < list.length; i++) {
        var prevEnd = list[i - 1].ts + (list[i - 1].durationSec || 0) * 1000;
        var g = (list[i].ts - prevEnd) / 1000;
        if (g >= 0) gaps.push(g);
      }
      if (!gaps.length) return;
      var avg = gaps.reduce(function (a, b3) { return a + b3; }, 0) / gaps.length;
      out.push({ label: b.label, n: list.length, avg: avg, min: Math.min.apply(null, gaps) });
    });
    return out.sort(function (a, b) { return a.avg - b.avg; });
  }

  function durationTable(evs) {
    var map = byBehavior(evs), out = [];
    Object.keys(map).forEach(function (bid) {
      var b = DB.behavior(bid); if (!b || b.measure !== 'dur') return;
      var list = map[bid].filter(function (e) { return e.durationSec != null; });
      if (!list.length) return;
      var total = list.reduce(function (a, e) { return a + e.durationSec; }, 0);
      out.push({ label: b.label, n: list.length, total: total, avg: total / list.length });
    });
    return out.sort(function (a, b) { return b.total - a.total; });
  }

  function latencyStats(evs, cues) {
    var lat = evs.filter(function (e) { return e.latencySec != null; });
    var avg = lat.length ? lat.reduce(function (a, e) { return a + e.latencySec; }, 0) / lat.length : null;
    var unresolved = cues.filter(function (c) { return !c.resolvedEventId; }).length;
    return { n: lat.length, avg: avg, cues: cues.length, unresolved: unresolved };
  }

  function intensityDist(evs) {
    var d = [0, 0, 0];
    evs.forEach(function (e) { if (e.intensity >= 1 && e.intensity <= 3) d[e.intensity - 1]++; });
    return d;
  }

  /* ---------- 렌더 ---------- */
  function statCard(k, v, d) {
    return '<div class="stat"><div class="k">' + E(k) + '</div><div class="v">' + E(v) + '</div>' + (d ? '<div class="d">' + E(d) + '</div>' : '') + '</div>';
  }

  function render(studentId, days, mode) {
    var asRate = (mode === 'rate');
    var st = DB.student(studentId);
    if (!st) return '<div class="empty">학생을 먼저 선택하세요.</div>';
    var r = rangeDays(days);
    var c = collect(studentId, r.from, r.to);
    var dl = dayList(r.from, r.to);

    if (!c.events.length && !c.runs.length) {
      return '<div class="empty"><strong>이 기간에는 기록이 없습니다</strong>홈에서 세션을 시작하면 여기에 그래프가 쌓입니다.</div>';
    }

    var probCount = 0, repCount = 0;
    c.events.forEach(function (e) { var b = DB.behavior(e.behaviorId); if (!b) return; b.isReplacement ? repCount++ : probCount++; });
    var ser = dailySeries(c.events, dl, c.sessions, asRate);
    var obsMin = totalMinutes(c.sessions);
    var lat = latencyStats(c.events, c.cues);
    var inten = intensityDist(c.events);
    var irt = irtTable(c.events);
    var dur = durationTable(c.events);
    var ante = antecedentBars(c.events);
    var cons = consequenceBars(c.events);
    var heat = heatGrid(c.sessions, c.events);

    var h = '';

    h += '<div class="stat-row" style="margin-bottom:14px">';
    if (asRate && obsMin >= 0.5) {
      h += statCard('문제행동', (Math.round(probCount / obsMin * 100) / 100) + ' 회/분', probCount + '회 / ' + Math.round(obsMin) + '분');
      h += statCard('대체행동', (Math.round(repCount / obsMin * 100) / 100) + ' 회/분', repCount + '회');
    } else {
      h += statCard('문제행동', probCount + '회', dl.length + '일간');
      h += statCard('대체행동', repCount + '회', repCount + probCount ? Math.round(repCount / (repCount + probCount) * 100) + '% 비중' : '');
    }
    h += statCard('관찰 시간', Math.round(obsMin) + '분', c.sessions.length + '개 세션');
    h += statCard('총 지속시간', fmtDur(dur.reduce(function (a, d2) { return a + d2.total; }, 0)), '');
    h += '</div>';

    h += '<div class="rep-grid">';

    /* 1. 일별 추이 */
    h += '<div class="card wide"><h3>일별 추이 · ' + (asRate ? '비율 (회/분)' : '횟수') + '</h3>';
    h += Charts.line({
      labels: dl.map(dayShort),
      series: [
        { name: '문제행동', color: '#C0453A', values: ser.problem },
        { name: '대체행동', color: '#3F7D20', values: ser.replacement }
      ]
    });
    h += '<div class="legend"><span><i style="background:#C0453A"></i>문제행동</span><span><i style="background:#3F7D20"></i>대체행동</span></div>';
    h += '<p class="note">두 선이 벌어지는 방향(문제행동 하강, 대체행동 상승)이 중재 성공의 핵심 지표입니다. ' +
      (asRate
        ? '관찰 시간으로 나눈 값이라 날마다 관찰 길이가 달라도 공정하게 비교됩니다. 관찰 시간이 없는 날은 0으로 표시됩니다.'
        : '날마다 관찰 시간이 크게 다르면 횟수만으로는 왜곡될 수 있습니다. 위에서 비율로 바꿔 보세요.') + '</p></div>';

    /* 2. 히트맵 */
    h += '<div class="card"><h3>시간대별 발생</h3>';
    h += heat ? Charts.heatmap(heat) : Charts.empty('세션에 교시를 입력하면 표시됩니다');
    h += '<p class="note">문제행동만 집계합니다. 진한 칸이 반복되면 그 시간대의 과제·환경을 먼저 점검하세요.</p></div>';

    /* 3. 선행사건 */
    h += '<div class="card"><h3>선행사건 분포</h3>';
    h += ante.length ? Charts.bars({ items: ante }) : Charts.empty('선행사건이 기록되지 않았습니다');
    h += '<p class="note">기능 추정의 출발점입니다. 한 항목이 절반을 넘으면 그 상황을 바꾸는 것이 가장 빠른 중재입니다.</p></div>';

    /* 4. 후속결과 */
    if (cons.length) {
      h += '<div class="card"><h3>후속결과 분포</h3>' + Charts.bars({ items: cons });
      h += '<p class="note">의도치 않게 행동을 강화하고 있는 반응이 있는지 확인하세요.</p></div>';
    }

    /* 5. 지속시간 */
    if (dur.length) {
      h += '<div class="card"><h3>지속시간</h3><table class="table"><thead><tr><th>행동</th><th class="n">횟수</th><th class="n">총 시간</th><th class="n">평균</th></tr></thead><tbody>';
      dur.forEach(function (d2) {
        h += '<tr><td>' + E(d2.label) + '</td><td class="n">' + d2.n + '</td><td class="n">' + E(fmtDur(d2.total)) + '</td><td class="n">' + E(fmtDur(d2.avg)) + '</td></tr>';
      });
      h += '</tbody></table></div>';
    }

    /* 6. 반응간시간 */
    h += '<div class="card"><h3>반응간시간</h3>';
    if (irt.length) {
      h += '<table class="table"><thead><tr><th>행동</th><th class="n">발생</th><th class="n">평균 간격</th><th class="n">최단</th></tr></thead><tbody>';
      irt.forEach(function (i) {
        h += '<tr><td>' + E(i.label) + '</td><td class="n">' + i.n + '</td><td class="n">' + E(fmtDur(i.avg)) + '</td><td class="n">' + E(fmtDur(i.min)) + '</td></tr>';
      });
      h += '</tbody></table>';
      h += '<p class="note">타행동 차별강화(DRO) 간격은 평균 간격보다 조금 짧게 잡아야 학생이 강화를 받을 수 있습니다. 간격이 길어지고 있다면 빈도가 그대로여도 중재는 효과가 있는 중입니다.</p>';
    } else { h += Charts.empty('같은 행동이 2회 이상 기록되면 계산됩니다'); }
    h += '</div>';

    /* 7. 지연시간 */
    h += '<div class="card"><h3>지연시간</h3>';
    if (lat.cues) {
      h += '<div class="stat-row">';
      h += statCard('평균 착수', lat.avg != null ? fmtDur(lat.avg) : '—', lat.n + '회 반응');
      h += statCard('지시 제시', lat.cues + '회', '');
      h += statCard('무반응', lat.unresolved + '회', lat.cues ? Math.round(lat.unresolved / lat.cues * 100) + '%' : '');
      h += '</div>';
    } else { h += Charts.empty('세션에서 "지시 제시"를 누르면 집계됩니다'); }
    h += '</div>';

    /* 8. 강도 */
    if (inten[0] + inten[1] + inten[2] > 0) {
      h += '<div class="card"><h3>강도 분포</h3>';
      h += Charts.bars({
        items: [
          { label: '1 · 약함', value: inten[0], color: '#7FA8B5' },
          { label: '2 · 보통', value: inten[1], color: '#B8600F' },
          { label: '3 · 심함', value: inten[2], color: '#C0453A' }
        ]
      });
      h += '<p class="note">빈도가 그대로여도 강도가 낮아지고 있다면 중재는 작동하고 있습니다.</p></div>';
    }

    /* 9. 간격기록 */
    if (c.runs.length) {
      h += '<div class="card wide"><h3>간격기록 결과</h3><table class="table"><thead><tr><th>날짜</th><th>행동</th><th>방식</th><th class="n">간격</th><th class="n">발생 비율</th></tr></thead><tbody>';
      c.runs.slice().reverse().forEach(function (run) {
        var b = DB.behavior(run.behaviorId);
        var hits = run.marks.filter(Boolean).length;
        var pct = run.marks.length ? Math.round(hits / run.marks.length * 100) : 0;
        h += '<tr><td>' + E(dayShort(dayKey(run.ts))) + '</td><td>' + E(b ? b.label : '삭제된 행동') + '</td><td>' + E(methodName(run.method)) + '</td><td class="n">' + run.intervalSec + '초</td><td class="n">' + pct + '% <span class="muted small">(' + hits + '/' + run.marks.length + ')</span></td></tr>';
      });
      h += '</tbody></table>';
      h += '<p class="note">부분간격은 과대추정, 전체간격과 순간표집은 과소추정하는 성질이 있습니다. 비교는 반드시 같은 방식·같은 간격 길이끼리만 하세요.</p></div>';
    }

    h += '</div>';
    return h;
  }

  function methodName(m) {
    return m === 'partial' ? '부분간격' : m === 'whole' ? '전체간격' : '순간표집';
  }

  /* ---------- CSV ---------- */
  function csv(studentId, days) {
    var r = rangeDays(days);
    var c = collect(studentId, r.from, r.to);
    var st = DB.student(studentId);
    var smap = {}; DB.dat().sessions.forEach(function (s) { smap[s.id] = s; });
    var rows = [['학생', '날짜', '시각', '교시', '장소', '활동', '영역', '행동', '측정방식', '지속시간(초)', '지연시간(초)', '강도', '선행사건', '후속결과', '메모']];
    c.events.forEach(function (e) {
      var b = DB.behavior(e.behaviorId), cat = b ? DB.category(b.categoryId) : null, s = smap[e.sessionId] || {};
      var d = new Date(e.ts);
      var a = DB.cfg().antecedents.filter(function (x) { return x.id === e.antecedentId; })[0];
      var q = DB.cfg().consequences.filter(function (x) { return x.id === e.consequenceId; })[0];
      rows.push([
        st.code, dayKey(e.ts), pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()),
        s.period || '', s.setting || '', s.activity || '',
        cat ? cat.label : '', b ? b.label : '', measureName(e.measure),
        e.durationSec != null ? Math.round(e.durationSec) : '', e.latencySec != null ? Math.round(e.latencySec) : '',
        e.intensity || '', a ? a.label : '', q ? q.label : '', e.memo || ''
      ]);
    });
    return rows.map(function (row) {
      return row.map(function (v) {
        v = String(v == null ? '' : v);
        return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      }).join(',');
    }).join('\n');
  }
  function measureName(m) { return m === 'freq' ? '빈도' : m === 'dur' ? '지속시간' : m === 'lat' ? '지연시간' : m || ''; }

  return {
    render: render, csv: csv, fmtDur: fmtDur, fmtClock: fmtClock,
    dayKey: dayKey, measureName: measureName, methodName: methodName, pad: pad
  };
})();

/* app.js — 화면 전환, 기록, 간격기록, 설정 */
(function () {
  var E = Charts.esc, R = Reports;
  var main = document.getElementById('main');
  var railBtns = Array.prototype.slice.call(document.querySelectorAll('.rail-btn'));
  var sheetEl = document.getElementById('sheet');
  var snackEl = document.getElementById('snackbar');
  var toastEl = document.getElementById('toast');
  var sideEl = document.getElementById('side');
  var sideLog = document.getElementById('side-log');

  var S = {
    screen: 'home',
    sessionId: null,
    catId: null,
    reportStudentId: null,
    reportDays: 14,
    reportMode: 'count',
    setupTab: 'behaviors',
    snack: null,
    snackTimer: null,
    cue: null,
    interval: null,

  };

  /* ================= 유틸 ================= */

  }
  function now() { return Date.now(); }
  function hhmm(ts) { var d = new Date(ts); return R.pad(d.getHours()) + ':' + R.pad(d.getMinutes()); }
  function hhmmss(ts) { var d = new Date(ts); return R.pad(d.getHours()) + ':' + R.pad(d.getMinutes()) + ':' + R.pad(d.getSeconds()); }

  function openSheet(title, body, onMount) {

      '<div class="sheet-head"><h2>' + E(title) + '</h2><button class="sheet-close" data-sheet-close aria-label="닫기">✕</button></div>' +

    sheetEl.hidden = false;

    var f = sheetEl.querySelector('input,select,textarea'); if (f && window.innerWidth > 700) f.focus();
  }
  function closeSheet() { sheetEl.hidden = true; sheetEl.innerHTML = ''; }
  /* 시트 안의 닫기와 칩 선택을 한 번만 등록한다 (열 때마다 등록하면 중복 실행되어 선택이 취소됨) */
  sheetEl.addEventListener('click', function (e) {

    if (!wasOn) c.classList.add('on');
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeSheet(); hideSnack(); } });

  function download(name, text, mime) {
    try {
      var blob = new Blob(['\ufeff' + text], { type: (mime || 'text/plain') + ';charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a'); a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
      toast('내려받았습니다');
    } catch (err) {
      openSheet(name, '<p class="small muted">내려받기가 막힌 환경입니다. 아래 내용을 복사해서 저장하세요.</p>' +
        '<textarea class="field" style="width:100%;min-height:220px;font-family:var(--mono);font-size:.75rem">' + E(text) + '</textarea>');
    }
  }

  /* ================= 내비게이션 ================= */
  function go(screen) {
    S.screen = screen;
    railBtns.forEach(function (b) {
      var on = b.dataset.nav === screen || (screen === 'session' && b.dataset.nav === 'home') || (screen === 'interval' && b.dataset.nav === 'home');
      if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    render();
    main.scrollTop = 0; window.scrollTo(0, 0);
  }
  railBtns.forEach(function (b) {
    /* 세션 중에도 홈으로 나갈 수 있다. 세션은 유지되고 홈에서 이어서 기록할 수 있다. */
    b.addEventListener('click', function () { go(b.dataset.nav); });
  });

  function render() {
    if (S.screen === 'home') main.innerHTML = viewHome();
    else if (S.screen === 'session') main.innerHTML = viewSession();
    else if (S.screen === 'interval') main.innerHTML = viewInterval();
    else if (S.screen === 'report') main.innerHTML = viewReport();
    else if (S.screen === 'setup') main.innerHTML = viewSetup();
    updateSide();
  }

  /* ================= 홈 ================= */
  function viewHome() {
    var studs = DB.students();
    var open = DB.dat().sessions.filter(function (s) { return !s.endedAt; })[0];
    var h = '<div class="page-head"><div class="grow"><div class="eyebrow">행동기록</div><h1>학생을 고르면 바로 시작합니다</h1></div>' +
      '<button class="btn" data-act="add-student">학생 추가</button></div>';

    if (open) {
      var st = DB.student(open.studentId);
      h += '<div class="card" style="border-color:var(--live);margin-bottom:14px"><div class="row">' +
        '<div class="grow"><strong>진행 중인 세션</strong><div class="small muted">' + E(st ? st.code : '?') + ' · ' + hhmm(open.startedAt) + ' 시작</div></div>' +
        '<button class="btn primary" data-act="resume" data-id="' + open.id + '">이어서 기록</button>' +
        '<button class="btn ghost" data-act="end-session" data-id="' + open.id + '">종료</button></div></div>';
    }

    if (!studs.length) {
      h += '<div class="empty"><strong>등록된 학생이 없습니다</strong>학생을 추가하면 기록을 시작할 수 있습니다. 이름 대신 이니셜이나 코드명을 권합니다.</div>';
      return h;
    }

    var since = daysSinceBackup();
    var total = DB.dat().events.filter(function (e) { return !e.deleted; }).length;
    if (total >= 20 && (since == null || since >= 7)) {
      h += '<div class="card" style="border-color:var(--warn);margin-bottom:14px"><div class="row">' +
        '<div class="grow"><strong>백업할 때가 되었습니다</strong><div class="small muted">' +
        (since == null ? '아직 백업한 적이 없습니다' : since + '일 전에 백업했습니다') +
        ' · 기록 ' + total + '건은 이 기기에만 있습니다</div></div>' +
        '<button class="btn" data-act="export-all">지금 백업</button></div></div>';
    }
    studs.forEach(function (s) {
      var n = DB.dat().events.filter(function (e) { return e.studentId === s.id && !e.deleted; }).length;
      h += '<div class="student-row">' +
        '<button class="student-main" data-act="pick-student" data-id="' + s.id + '">' +
        '<span class="grow"><span style="display:block;font-weight:600">' + E(s.code) + '</span>' +
        '<span class="small muted">' + (s.note ? E(s.note) + ' · ' : '') + '누적 ' + n + '건</span></span>' +
        '<span class="pill">시작</span></button>' +
        '<button class="icon-btn" data-act="edit-student" data-id="' + s.id + '" aria-label="' + E(s.code) + ' 수정">' +
        '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button></div>';
    });
    return h;
  }

  function sheetStudent(existing) {
    var s = existing || { code: '', note: '' };
    openSheet(existing ? '학생 수정' : '학생 추가',
      '<div class="field"><label for="f-code">코드명</label><input id="f-code" value="' + E(s.code) + '" placeholder="예: 3-1 김OO 또는 A학생" maxlength="24">' +
      '<span class="hint">개인정보 보호를 위해 실명 대신 이니셜·코드명을 권합니다.</span></div>' +
      '<div class="field"><label for="f-note">메모</label><input id="f-note" value="' + E(s.note || '') + '" placeholder="학년·반, 주 표적행동 등" maxlength="60"></div>' +
      '<div class="row"><button class="btn primary grow" data-act="save-student" data-id="' + (existing ? existing.id : '') + '">저장</button>' +
      (existing ? '<button class="btn danger" data-act="del-student" data-id="' + existing.id + '">삭제</button>' : '') + '</div>');
  }

  /* ================= 세션 시작 ================= */
  var PERIODS = ['1교시', '2교시', '3교시', '4교시', '5교시', '6교시', '7교시', '방과후'];
  var SETTINGS_P = ['특수학급', '통합학급', '운동장', '급식실', '복도', '치료실'];
  var ACTS = ['국어', '수학', '자유놀이', '전이', '집단활동', '개별과제'];

  function chipRow(name, list, sel) {
    return '<div class="chips">' + list.map(function (v) {
      return '<button class="chip' + (v === sel ? ' on' : '') + '" data-chip="' + name + '" data-val="' + E(v) + '">' + E(v) + '</button>';
    }).join('') + '</div>';
  }

  function sheetStartSession(studentId) {
    var st = DB.student(studentId);
    openSheet(E(st.code) + ' · 세션 시작',
      '<div class="chip-label">교시</div>' + chipRow('period', PERIODS, '') +
      '<div class="chip-label">장소</div>' + chipRow('setting', SETTINGS_P, '') +
      '<div class="chip-label">활동</div>' + chipRow('activity', ACTS, '') +
      '<div class="divider"></div>' +
      '<div class="row"><button class="btn primary lg grow" data-act="start-session" data-id="' + studentId + '" data-mode="live">실시간 기록 시작 (빈도 포함)</button></div>' +
      '<div class="row" style="margin-top:8px"><button class="btn lg grow" data-act="start-session" data-id="' + studentId + '" data-mode="interval">간격기록 시작</button></div>' +
      '<p class="note">교시·장소·활동은 선택 사항이지만, 입력해 두면 리포트의 시간대별 히트맵이 만들어집니다.</p>');
  }

  function readChip(name) {
    var el = sheetEl.querySelector('[data-chip="' + name + '"].on');
    return el ? el.dataset.val : '';
  }

  async function startSession(studentId, mode) {
    var ses = {
      id: DB.uid('s'), studentId: studentId, startedAt: now(), endedAt: null,
      period: readChip('period'), setting: readChip('setting'), activity: readChip('activity'),
      mode: mode
    };
    DB.dat().sessions.push(ses);
    await DB.saveData();
    S.sessionId = ses.id; S.catId = null; S.cue = null;
    closeSheet();
    go(mode === 'interval' ? 'interval' : 'session');
  }

  async function endSession(id) {
    var ses = DB.session(id || S.sessionId); if (!ses) return;
    DB.dat().events.forEach(function (e) {
      if (e.sessionId === ses.id && e.status === 'running') {
        e.durationSec = Math.round((now() - e.ts) / 1000); e.status = 'done';
      }
    });
    ses.endedAt = now();
    await DB.saveData();
    S.sessionId = null; S.catId = null; S.cue = null; S.interval = null;
    hideSnack();
    toast('세션을 종료했습니다');
    go('home');
  }

  /* ================= 실시간 기록 ================= */
  function runningEvents() {
    if (!S.sessionId) return [];
    return DB.dat().events.filter(function (e) { return e.sessionId === S.sessionId && e.status === 'running' && !e.deleted; });
  }
  function countOf(behaviorId) {
    if (!S.sessionId) return 0;
    return DB.dat().events.filter(function (e) { return e.sessionId === S.sessionId && e.behaviorId === behaviorId && !e.deleted; }).length;
  }
  function catCount(catId) {
    var ids = {}; DB.behaviors(catId).forEach(function (b) { ids[b.id] = 1; });
    return DB.dat().events.filter(function (e) { return e.sessionId === S.sessionId && ids[e.behaviorId] && !e.deleted; }).length;
  }
  function hasLatency() {
    return DB.behaviors().some(function (b) { return b.measure === 'lat'; });
  }

  function viewSession() {
    var ses = DB.session(S.sessionId);
    if (!ses) { S.sessionId = null; return viewHome(); }
    var st = DB.student(ses.studentId);
    var ctx = [ses.period, ses.setting, ses.activity].filter(Boolean).join(' · ');

    var h = '<div class="session-bar">' +
      '<span class="grow"><span class="who">' + E(st ? st.code : '?') + '</span>' +
      (ctx ? '<span class="ctx" style="display:block">' + E(ctx) + '</span>' : '') + '</span>' +
      '<span class="clock" id="ses-clock">00:00</span>' +
      '<button class="btn ghost" data-act="go-home">홈</button>' +
      '<button class="btn ghost" data-act="end-session">종료</button></div>';

    /* 진행 중 지속시간 */
    runningEvents().forEach(function (e) {
      var b = DB.behavior(e.behaviorId);
      h += '<div class="live-strip"><span class="live-dot"></span><span class="name">' + E(b ? b.label : '?') + '</span>' +
        '<span class="t" data-since="' + e.ts + '">00:00</span>' +
        '<button class="btn danger" data-act="stop-dur" data-id="' + e.id + '">종료</button></div>';
    });

    /* 지시 제시 */
    if (hasLatency()) {
      if (S.cue) {
        h += '<div class="cue-strip active"><span class="grow">지시 제시 후 대기 중 — 착수하면 해당 행동을 누르세요</span>' +
          '<span class="clock" id="cue-clock" data-since="' + S.cue.ts + '">0초</span>' +
          '<button class="btn ghost" data-act="cue-none">무반응</button></div>';
      } else {
        h += '<div class="cue-strip"><span class="grow muted small">지연시간을 재려면 지시를 준 순간에 누르세요</span>' +
          '<button class="btn" data-act="cue">지시 제시</button></div>';
      }
    }

    /* 타일 */
    if (!S.catId) {
      var cats = DB.categories();
      h += '<div class="tile-grid">' + cats.map(function (c) {
        var n = catCount(c.id);
        return '<button class="tile big" style="--cat:' + c.color + '" data-act="cat" data-id="' + c.id + '">' +
          '<span class="tile-label">' + E(c.label) + '</span>' +
          '<span class="tile-foot"><span class="tile-count' + (n ? '' : ' zero') + '">' + n + '</span>' +
          '<span class="tile-sub">' + DB.behaviors(c.id).length + '개</span></span></button>';
      }).join('') + '</div>';
      h += '<p class="note">영역을 누르고 세부행동을 누르면 저장됩니다. 세부행동을 길게 누르면 조작적 정의와 강도를 조정할 수 있습니다.</p>';
    } else {
      var cat = DB.category(S.catId);
      h += '<div class="row" style="margin-bottom:10px"><button class="btn-back" data-act="cat-back">← 영역 전체</button>' +
        '<span class="spacer"></span><span class="pill">' + E(cat.label) + '</span>' +
        '<button class="btn ghost small" data-act="add-beh" data-id="' + cat.id + '">행동 편집</button></div>';
      var bs = DB.behaviors(S.catId);
      if (!bs.length) {
        h += '<div class="empty"><strong>이 영역에 세부행동이 없습니다</strong>설정에서 추가하세요.</div>';
      } else {
        h += '<div class="tile-grid">' + bs.map(function (b) {
          var n = countOf(b.id);
          var run = runningEvents().filter(function (e) { return e.behaviorId === b.id; })[0];
          return '<button class="tile big' + (run ? ' running' : '') + '" style="--cat:' + cat.color + '" data-act="beh" data-id="' + b.id + '">' +
            '<span class="tile-label">' + E(b.label) + '</span>' +
            '<span class="tile-foot"><span class="tile-count' + (n ? '' : ' zero') + '">' + n + '</span>' +
            '<span class="tile-sub">' + (run ? '기록 중 · 눌러 종료' : R.measureName(b.measure)) + '</span></span></button>';
        }).join('') + '</div>';
      }
    }

    h += '<div class="divider"></div><h3 style="margin-bottom:8px">최근 기록</h3><div id="log-inline"></div>';
    return h;
  }

  function logHtml(limit) {
    var evs = DB.eventsOf(S.sessionId).slice().sort(function (a, b) { return b.ts - a.ts; }).slice(0, limit || 12);
    if (!evs.length) return '<p class="small muted">아직 기록이 없습니다.</p>';
    return evs.map(function (e) {
      var b = DB.behavior(e.behaviorId);
      var val = '';
      if (e.status === 'running') val = '기록 중';
      else if (e.durationSec != null) val = R.fmtDur(e.durationSec);
      else if (e.latencySec != null) val = '착수 ' + R.fmtDur(e.latencySec);
      if (e.intensity && e.intensity !== 2) val += (val ? ' · ' : '') + '강도 ' + e.intensity;
      return '<button class="log-item' + (b && b.isReplacement ? ' rep' : '') + '" data-act="edit-event" data-id="' + e.id + '">' +
        '<span class="ts">' + hhmmss(e.ts) + '</span>' +
        '<span class="nm">' + E(b ? b.label : '삭제된 행동') + '</span>' +
        '<span class="vl">' + E(val) + '</span></button>';
    }).join('');
  }
  function updateLog() {
    var a = document.getElementById('log-inline'); if (a) a.innerHTML = logHtml(12);
    updateSide();
  }
  function updateSide() {
    if (!sideEl) return;
    if (S.screen === 'session' && S.sessionId) { sideEl.hidden = false; sideLog.innerHTML = logHtml(40); }
    else sideEl.hidden = true;
  }

  async function tapBehavior(behaviorId) {
    var b = DB.behavior(behaviorId); if (!b) return;
    var run = runningEvents().filter(function (e) { return e.behaviorId === behaviorId; })[0];
    if (run) { return stopDuration(run.id); }

    if (b.measure === 'dur' && runningEvents().length >= 2) {
      toast('동시에 잴 수 있는 지속시간은 2건까지입니다');
      return;
    }
    var ev = {
      id: DB.uid('e'), sessionId: S.sessionId, studentId: DB.session(S.sessionId).studentId,
      ts: now(), behaviorId: behaviorId, measure: b.measure,
      durationSec: null, latencySec: null,
      intensity: b.useIntensity ? 2 : null,
      antecedentId: null, consequenceId: null, memo: '',
      status: b.measure === 'dur' ? 'running' : 'done', deleted: false
    };
    if (b.measure === 'lat' && S.cue) {
      ev.latencySec = Math.round((now() - S.cue.ts) / 10) / 100;
      var cue = DB.dat().cues.filter(function (c) { return c.id === S.cue.id; })[0];
      if (cue) cue.resolvedEventId = ev.id;
      S.cue = null;
    }
    DB.dat().events.push(ev);
    await DB.saveData();
    buzz(b.measure === 'dur' ? 26 : 14);
    render();
    updateLog();
    if (ev.status !== 'running') showSnack(ev);
  }

  async function stopDuration(eventId) {
    var e = DB.dat().events.filter(function (x) { return x.id === eventId; })[0];
    if (!e) return;
    e.durationSec = Math.max(1, Math.round((now() - e.ts) / 1000));
    e.status = 'done';
    await DB.saveData();
    buzz(26);
    render(); updateLog(); showSnack(e);
  }

  async function pressCue() {
    var ses = DB.session(S.sessionId); if (!ses) return;
    var cue = { id: DB.uid('u'), sessionId: ses.id, studentId: ses.studentId, ts: now(), resolvedEventId: null };
    DB.dat().cues.push(cue);
    S.cue = cue;
    await DB.saveData();
    buzz(14); render();
  }
  async function cueTimeout(manual) {
    if (!S.cue) return;
    S.cue = null;
    await DB.saveData();
    render();
    if (manual) toast('무반응으로 기록했습니다');
  }

  /* ---------- 스낵바 (실행취소 + ABC) ---------- */
  function showSnack(ev) {
    var b = DB.behavior(ev.behaviorId);
    S.snack = ev.id;
    var secs = DB.settings().snackbarSec || 6;
    var val = ev.durationSec != null ? ' · ' + R.fmtDur(ev.durationSec) : (ev.latencySec != null ? ' · 착수 ' + R.fmtDur(ev.latencySec) : '');
    snackEl.innerHTML =
      '<div class="sb-top"><span class="sb-name">' + E(b ? b.label : '?') + E(val) + '</span>' +
      (b && b.useIntensity ? '<button class="chip" data-act="snack-intensity">강도 ' + (ev.intensity || 2) + '</button>' : '') +
      '<button class="sb-undo" data-act="undo">실행취소</button></div>' +
      '<div class="chip-label">선행사건</div>' +
      '<div class="chips">' + DB.antecedents().map(function (a) {
        return '<button class="chip" data-act="ante" data-id="' + a.id + '">' + E(a.label) + '</button>';
      }).join('') + '</div>' +
      '<div class="chip-label">후속결과</div>' +
      '<div class="chips">' + DB.consequences().map(function (c) {
        return '<button class="chip" data-act="cons" data-id="' + c.id + '">' + E(c.label) + '</button>';
      }).join('') + '</div>' +
      '<div class="sb-progress"><i id="sb-bar"></i></div>';
    snackEl.hidden = false;
    var bar = document.getElementById('sb-bar');
    bar.style.transition = 'none'; bar.style.transform = 'scaleX(1)';
    requestAnimationFrame(function () {
      bar.style.transition = 'transform ' + secs + 's linear';
      bar.style.transform = 'scaleX(0)';
    });
    clearTimeout(S.snackTimer);
    S.snackTimer = setTimeout(hideSnack, secs * 1000);
  }
  function hideSnack() { clearTimeout(S.snackTimer); snackEl.hidden = true; S.snack = null; }
  function holdSnack() {
    clearTimeout(S.snackTimer);
    var bar = document.getElementById('sb-bar');
    if (bar) { bar.style.transition = 'none'; bar.style.transform = 'scaleX(1)'; }
    S.snackTimer = setTimeout(hideSnack, 8000);
  }

  async function undoLast() {
    if (!S.snack) return;
    var e = DB.dat().events.filter(function (x) { return x.id === S.snack; })[0];
    if (e) { e.deleted = true; await DB.saveData(); }
    hideSnack(); render(); updateLog(); toast('기록을 취소했습니다');
  }
  async function setABC(kind, id) {
    if (!S.snack) return;
    var e = DB.dat().events.filter(function (x) { return x.id === S.snack; })[0]; if (!e) return;
    var field = kind === 'ante' ? 'antecedentId' : 'consequenceId';
    e[field] = (e[field] === id) ? null : id;
    await DB.saveData();
    snackEl.querySelectorAll('[data-act="' + kind + '"]').forEach(function (btn) {
      btn.classList.toggle('on', btn.dataset.id === e[field]);
    });
    holdSnack();
    updateLog();
  }

  function sheetIntensity(eventId) {
    var e = DB.dat().events.filter(function (x) { return x.id === eventId; })[0]; if (!e) return;
    var b = DB.behavior(e.behaviorId);
    openSheet('강도 · ' + (b ? b.label : ''),
      '<p class="small muted">기본값은 2입니다. 팀에서 합의한 기준으로 조정하세요.</p>' +
      [['1', '약함 · 흔적이 남지 않고 즉시 진정'], ['2', '보통 · 제지가 필요하나 손상 없음'], ['3', '심함 · 상해·손상 또는 신체 개입 필요']].map(function (o) {
        return '<button class="iv-toggle' + (String(e.intensity) === o[0] ? ' on' : '') + '" data-act="set-intensity" data-id="' + eventId + '" data-val="' + o[0] + '">' +
          '<span>' + o[0] + '</span><span class="state" style="flex:1;text-align:left;margin-left:10px">' + E(o[1]) + '</span></button>';
      }).join(''));
  }

  function sheetDefinition(behaviorId) {
    var b = DB.behavior(behaviorId); if (!b) return;
    var c = DB.category(b.categoryId);
    openSheet(b.label,
      '<div class="row" style="margin-bottom:10px"><span class="pill">' + E(c ? c.label : '') + '</span>' +
      '<span class="badge-measure">' + R.measureName(b.measure) + '</span>' +
      (b.useIntensity ? '<span class="badge-measure">강도 사용</span>' : '') +
      (b.isReplacement ? '<span class="badge-measure">대체행동</span>' : '') + '</div>' +
      '<div class="chip-label">조작적 정의</div>' +
      '<p style="font-size:.9rem;line-height:1.6">' + (b.definition ? E(b.definition) : '<span class="muted">아직 정의가 없습니다. 아래에서 바로 작성할 수 있습니다. 정의가 없으면 며칠 뒤의 자신과 기준이 달라집니다.</span>') + '</p>' +
      '<button class="btn block" data-act="edit-beh" data-id="' + b.id + '" style="margin-top:12px">이 행동 수정</button>');
  }

  /* ================= 간격기록 ================= */
  function viewInterval() {
    var ses = DB.session(S.sessionId);
    if (!ses) { S.sessionId = null; return viewHome(); }
    var st = DB.student(ses.studentId);

    if (!S.interval) {
      var groups = DB.categories().map(function (cat) {
        var bs = DB.behaviors(cat.id);
        if (!bs.length) return '';
        return '<div class="iv-group"><div class="iv-group-head"><span class="swatch" style="background:' + cat.color + '"></span>' +
          E(cat.label) + '</div>' +

  function startInterval() {
    var picked = Array.prototype.slice.call(sheetOrMain().querySelectorAll('[data-act="iv-pick"].on')).map(function (b) { return b.dataset.id; });
    if (!picked.length) { toast('행동을 1개 이상 고르세요'); return; }
    var method = pickChip('method') || 'partial';
    var isec = parseInt(pickChip('ivsec') || '10', 10);
    var mins = parseInt(pickChip('ivmin') || '5', 10);
    S.interval = {
      method: method, intervalSec: isec, totalIntervals: Math.round(mins * 60 / isec),
      index: 0, startTs: now(),
      behaviors: picked.map(function (id) { return { id: id, on: false, onTime: 0, lastOn: null, marks: [] }; })
    };
    render();
    renderCells();
  }
  function sheetOrMain() { return main; }
  function pickChip(name) {
    var el = main.querySelector('[data-chip="' + name + '"].on');
    return el ? el.dataset.val : null;
  }
  function renderCells() {
    if (!S.interval) return;
    S.interval.behaviors.forEach(function (b, i) {
      var box = document.getElementById('iv-cells-' + i); if (!box) return;
      var html = '';
      for (var k = 0; k < S.interval.totalIntervals; k++) {
        var cls = 'iv-cell' + (b.marks[k] ? ' hit' : '') + (k === S.interval.index ? ' now' : '');
        html += '<span class="' + cls + '"></span>';
      }
      box.innerHTML = html;
    });
  }
  function ivToggle(idx) {
    var b = S.interval.behaviors[idx]; if (!b) return;
    b.on = !b.on;
    if (b.on) b.lastOn = now();
    else if (b.lastOn) { b.onTime += (now() - b.lastOn) / 1000; b.lastOn = null; }
    var btn = main.querySelectorAll('[data-act="iv-toggle"]')[idx];
    if (btn) {
      btn.classList.toggle('on', b.on);
      btn.querySelector('.state').textContent = b.on ? '발생 중' : '발생 중이면 눌러 두세요';
    }
    buzz(12);
  }
  function ivTick() {
    var iv = S.interval; if (!iv) return;
    var elapsed = (now() - iv.startTs) / 1000;
    var idx = Math.floor(elapsed / iv.intervalSec);
    var inInt = elapsed - idx * iv.intervalSec;
    var remainEl = document.getElementById('iv-remain');
    if (remainEl) remainEl.textContent = Math.max(0, Math.ceil(iv.intervalSec - inInt));
    var leftEl = document.getElementById('iv-left');
    if (leftEl) leftEl.textContent = R.fmtClock(iv.totalIntervals * iv.intervalSec - elapsed);
    var fill = document.getElementById('iv-fill');
    if (fill) fill.style.width = Math.min(100, (elapsed / (iv.totalIntervals * iv.intervalSec)) * 100) + '%';

    if (idx > iv.index) {
      /* 경계 시점의 상태를 먼저 확정 (순간표집) */
      while (iv.index < idx && iv.index < iv.totalIntervals) {
        iv.behaviors.forEach(function (b) {
          if (b.on && b.lastOn) { b.onTime += (now() - b.lastOn) / 1000; b.lastOn = now(); }
          var mark;
          if (iv.method === 'partial') mark = b.onTime > 0.2;
          else if (iv.method === 'whole') mark = b.onTime >= iv.intervalSec * 0.9;
          else mark = b.on;
          b.marks[iv.index] = !!mark;
          b.onTime = 0;
        });
        iv.index++;
      }
      var idxEl = document.getElementById('iv-idx');
      if (idxEl) idxEl.textContent = Math.min(iv.index + 1, iv.totalIntervals);
      renderCells();
      buzz(30);
      if (iv.index >= iv.totalIntervals) finishInterval();
    }
  }
  async function finishInterval() {
    var iv = S.interval; if (!iv) return;
    var ses = DB.session(S.sessionId);
    iv.behaviors.forEach(function (b) {
      DB.dat().intervalRuns.push({
        id: DB.uid('r'), sessionId: ses.id, studentId: ses.studentId, behaviorId: b.id,
        method: iv.method, intervalSec: iv.intervalSec, ts: now(),
        marks: b.marks.slice(0, iv.totalIntervals).map(function (m) { return !!m; })
      });
    });
    var summary = iv.behaviors.map(function (b) {
      var hits = b.marks.filter(Boolean).length;
      var beh = DB.behavior(b.id);
      return '<div class="stat"><div class="k">' + E(beh ? beh.label : '?') + '</div>' +
        '<div class="v">' + Math.round(hits / iv.totalIntervals * 100) + '%</div>' +
        '<div class="d">' + hits + ' / ' + iv.totalIntervals + ' 간격</div></div>';
    }).join('');
    S.interval = null;
    await DB.saveData();
    render();
    openSheet('간격기록 완료', '<div class="stat-row">' + summary + '</div>' +
      '<p class="note">' + R.methodName(iv.method) + ' · ' + iv.intervalSec + '초 간격으로 기록했습니다. 다음에 비교할 때도 같은 방식과 간격을 사용하세요.</p>' +
      '<button class="btn primary block" data-sheet-close style="margin-top:12px">확인</button>');
  }
